name: norway_smartlife
description: Norway SmartLife V5.0 Native Mobile Platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  http: ^1.2.0

  # Supabase Backend
  supabase_flutter: ^2.3.0
  
  # UI & Maps
  lucide_icons: ^1.0.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.4

  # Voice & AI
  speech_to_text: ^6.5.1
  
  # Storage & Caching (Offline Mode)
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.2

  # Network & Location
  geolocator: ^11.0.1
  
  # Notifications
  firebase_core: ^2.25.4
  firebase_messaging: ^14.7.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
