<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="skyGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#09203f"/>
      <stop offset="60%" stop-color="#061224"/>
      <stop offset="100%" stop-color="#020813"/>
    </radialGradient>

    <!-- Aurora Gradient -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#05d5b3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00a8ff" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Mountain Gradient -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="50%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#083344"/>
    </linearGradient>

    <!-- Tech Circuit Stroke Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Outer Dark Circular Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#skyGrad)" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.4" />

  <!-- Stars in the night sky -->
  <circle cx="28" cy="20" r="0.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="72" cy="18" r="0.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="42" cy="14" r="0.6" fill="#ffffff" opacity="0.7"/>
  <circle cx="65" cy="28" r="0.6" fill="#ffffff" opacity="0.9"/>

  <!-- Northern Lights (Aurora Borealis Arc) -->
  <path d="M 45,8 Q 62,18 52,32 Q 46,40 58,45" fill="none" stroke="url(#auroraGrad)" stroke-width="7" stroke-linecap="round" opacity="0.85" filter="drop-shadow(0 0 6px #00ffcc)" />
  <path d="M 50,6 Q 68,16 56,30 Q 52,36 62,42" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Snowy Mountain Range / Fjord Peaks -->
  <!-- Left Peak -->
  <polygon points="12,65 32,30 48,65" fill="url(#mountainGrad)" />
  <polygon points="32,30 38,45 32,48 26,44" fill="#ffffff" opacity="0.95" />
  
  <!-- Right Peak -->
  <polygon points="36,65 52,38 70,65" fill="#334155" />
  <polygon points="52,38 57,48 52,50 48,46" fill="#f8fafc" opacity="0.9" />

  <!-- Fjord Water Body -->
  <path d="M 12,65 Q 40,60 88,65 L 88,85 Q 50,92 12,85 Z" fill="url(#waterGrad)" />

  <!-- Smart Technology Circuit Curve -->
  <path d="M 16,80 C 25,62 55,62 82,72" fill="none" stroke="url(#circuitGrad)" stroke-width="3.5" stroke-linecap="round" filter="drop-shadow(0 0 4px #00ffcc)" />
  
  <!-- Tech Nodes / Connection Dots -->
  <path d="M 18,74 L 10,74" fill="none" stroke="#00ffcc" stroke-width="2" />
  <circle cx="10" cy="74" r="2.5" fill="#00ffcc" />
  
  <path d="M 24,80 L 14,80" fill="none" stroke="#00ffcc" stroke-width="2" />
  <circle cx="14" cy="80" r="2.5" fill="#00ffcc" />

  <path d="M 28,86 L 20,86" fill="none" stroke="#00ffcc" stroke-width="2" />
  <circle cx="20" cy="86" r="2.5" fill="#00ffcc" />

  <!-- Red Fjord Lighthouse Silhouette -->
  <rect x="70" y="48" width="5" height="15" fill="#ef4444" rx="1" />
  <polygon points="70,48 72.5,43 75,48" fill="#ffffff" />
  <circle cx="72.5" cy="46" r="1.5" fill="#fef08a" filter="drop-shadow(0 0 3px #fde047)" />
</svg>