name: Norway SmartLife CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: TypeScript Compile Check
      run: npx tsc --noEmit
      
    - name: Lint Code
      run: npm run lint
      continue-on-error: true # Warning only for now
      
    - name: Build Production Artifact
      run: npm run build
      
    # Note: Vercel handles its own deployments automatically upon push to main.
    # This pipeline ensures code quality before Vercel builds.
